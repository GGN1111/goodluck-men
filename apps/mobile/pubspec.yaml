name: signalready_pocket
description: "SignalReady Pocket — 100% offline, grid-proof emergency co-pilot."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Storage (T006 — SQLite per plan.md)
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  # Local alarms (T038/T039 — flutter_local_notifications, research R8)
  flutter_local_notifications: ^22.3.1
  # Offline OCR (T034 — research R6)
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.1.2
  # Exact local alarms (T038 — research R8; timezone for zonedSchedule)
  timezone: ^0.11.0
  # llama.cpp FFI bindings (T017 — research R1)
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Host-side SQLite for integration tests (T023/T058 — no device needed)
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  # Directory assets: everything under these dirs is bundled (incl. any
  # GGUF placed into assets/models/ per README placement contract).
  assets:
    - assets/models/
    - assets/bantay/
    - assets/guides/
